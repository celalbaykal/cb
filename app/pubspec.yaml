name: screenguard
description: A screen time tracker with per-app limits, a total daily limit, and a self-authored block screen.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_mobile_ads: ^5.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# Run `dart run flutter_launcher_icons` (after `flutter pub get`) to generate
# every Android mipmap density from these three source images — see
# assets/icon/ and README.md. `ios` is off until `flutter create
# --platforms=ios` has generated ios/Runner/Assets.xcassets/AppIcon.appiconset
# for this to write into — flip it to true once that exists, then rerun.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 26
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
